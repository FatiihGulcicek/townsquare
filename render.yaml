# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: townsquare
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # extra origins allowed to connect to the live server (comma separated), e.g. myclocktower.com
      - key: ALLOWED_ORIGINS
        value: ""
      # protects /metrics?token=... ; leave empty to keep it public
      - key: METRICS_TOKEN
        generateValue: true
      # keeps push notification keys stable across restarts
      - key: PUSH_SECRET
        generateValue: true
      # database secret (rooms survive restarts, profiles and statistics)
      - key: VK_DB_SECRET
        sync: false
