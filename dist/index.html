    html { background: #05060d; } body { margin: 0; }
    #boot { position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: linear-gradient(#1d2233, #10131f 60%, #05060d); transition: opacity .5s ease; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #boot.out { opacity: 0; pointer-events: none; }
    /* wide screens: a blurred copy of the artwork fills the sides */
    #boot::before { content: ""; position: absolute; inset: -40px; background: url("static/loading-bg.webp") center 70% / cover no-repeat; filter: blur(24px) brightness(.55); }
    /* the artwork keeps its shape and sits on the bottom edge, so the frame
       of the loading bar is always visible; the bar sits inside the frame */
    #boot .stage { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100vw, 75vh); aspect-ratio: 941 / 1672; background: url("static/loading-bg.webp") center / 100% 100% no-repeat; }
    #boot .stage { -webkit-mask-image: linear-gradient(transparent, #000 10%); mask-image: linear-gradient(transparent, #000 10%); }
    #boot .bar { position: absolute; left: 9.6%; width: 80.8%; top: 77.6%; height: 3.1%; border-radius: 999px; overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #6b0a14, #d01c33 55%, #e9b44c); box-shadow: 0 0 14px rgba(255, 70, 90, .85), inset 0 2px 3px rgba(255,255,255,.35); transition: width .4s ease; }
    #boot .bar small { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #f6ecd8; font-size: clamp(10px, 2.6vw, 14px); font-weight: 700; letter-spacing: .06em; text-shadow: 0 1px 3px #000, 0 0 6px #000; white-space: nowrap; }
    #boot .logo { position: absolute; left: 50%; top: calc(env(safe-area-inset-top) + 3.5vh); transform: translateX(-50%); width: min(94vw, 560px); height: auto; filter: drop-shadow(0 10px 24px rgba(0,0,0,.75)); animation: boot-logo 1s cubic-bezier(.2,1.3,.4,1) both; }
    @keyframes boot-logo { from { opacity: 0; transform: translateX(-50%) scale(.85); } }</style><script defer="defer" src="/js/chunk-vendors.75457112.js"></script><script defer="defer" src="/js/app.7540957a.js"></script><link href="/css/app.5b6828aa.css" rel="stylesheet"></head><body><noscript>Vampir Köylü için JavaScript gereklidir.</noscript><div id="boot"><div class="stage"><div class="bar"><i id="boot-bar"></i><small id="boot-text">Köy uyanıyor…</small></div></div><img class="logo" src="static/darkspire-logo.webp" alt="Darkspire · Vampir Köylü"></div><script>/*
 * Loading screen: fills the bar while the game loads, checks the server for a
 * newer version and, if there is one, installs it right here before the game
 * opens (clears the cached app and reloads once).
 */
(function () {
  var BUILD = "1793653803526";
  var en = (localStorage.getItem("vkLang") || (navigator.language || "tr").slice(0, 2)) === "en";
  var bar = document.getElementById("boot-bar");
  var text = document.getElementById("boot-text");
  var start = Date.now(), pct = 8, timer;
  if (en) text.textContent = "The village is waking up…";
  function set(p) { pct = Math.max(pct, p); bar.style.width = pct + "%"; }
  timer = setInterval(function () { set(pct + (90 - pct) * 0.12); }, 250);
  set(12);
  window.__bootUpdating = false;
  window.__hideBoot = function () {
    if (window.__bootUpdating) return;
    var wait = Math.max(0, 1300 - (Date.now() - start));
    setTimeout(function () {
      if (window.__bootUpdating) return;
      clearInterval(timer); set(100);
      var boot = document.getElementById("boot");
      if (!boot) return;
      boot.classList.add("out");
      setTimeout(function () { boot.remove(); }, 550);
    }, wait);
  };
  if (!window.fetch || !BUILD) return;
  fetch("/version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (v) {
      var key = "vkUpdated:" + v.build;
      if (!v.build || v.build === BUILD || sessionStorage.getItem(key)) return;
      sessionStorage.setItem(key, "1"); // never loop
      window.__bootUpdating = true;
      text.textContent = en ? "Installing the new version…" : "Yeni sürüm yükleniyor…";
      set(60);
      var jobs = [];
      if (window.caches) {
        jobs.push(caches.keys().then(function (names) {
          return Promise.all(names.filter(function (n) { return n.indexOf("km-shell") === 0; })
            .map(function (n) { return caches.delete(n); }));
        }));
      }
      if (navigator.serviceWorker) {
        jobs.push(navigator.serviceWorker.getRegistration().then(function (r) { return r && r.update(); }));
      }
      Promise.all(jobs).catch(function () {}).then(function () {
        set(100);
        setTimeout(function () { location.reload(); }, 300);
      });
    })
    .catch(function () {});
})();</script><div id="app"></div></body></html>
